services:
  db:
    image: postgres:15-alpine
    container_name: emergencial_aid_db_container
    env_file:
      - .env
    environment:
      POSTGRES_DB: emergencial_aid_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emergencial_aid_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastapi_api_server
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/emergencial_aid_db"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  app_runner:
    build: .
    container_name: emergencial_aid_runner
    user: appuser
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/emergencial_aid_db"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  postgres_data: